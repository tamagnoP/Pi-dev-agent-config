# Read the Docs build recipe.
#
# Commit this even while the repository is private. It is INERT until the
# project is connected on readthedocs.org, and committing it now means
# publishing is a web-UI click rather than a code change — and the recipe
# cannot drift from the docs/ it describes in the meantime.
#
# Two facts to know before relying on it:
#   * The Community (free) tier builds PUBLIC repositories only.
#   * The version list starts at the first tag cut AFTER docs/ is committed.
#     A version is built from its own checkout, so a tag without conf.py can
#     never be documented — which is why docs/ belongs in the repository from
#     the first module, not from 1.0.0.
#
# Limits to measure against before trusting it: 15 minutes wall time, 3 GB RAM.
# Time a cold `pip install --no-cache-dir` plus a cold `sphinx-build` and keep
# the numbers in DECISIONS.md.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "PY_MIN"
  apt_packages:
    # Only if a dependency imports OpenGL (vtk, pyvista, Qt). Delete otherwise.
    - libgl1
    - libglx-mesa0
    - libxrender1

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        # The docs are built from the IMPORTED package: a module that cannot be
        # imported is not documented, and an undocumented module cannot fail
        # the build. So the extras are installed, not mocked.
        - all
        - docs

sphinx:
  configuration: docs/conf.py
  # The same gate as CI: a docstring that does not render fails the build
  # rather than publishing a page nobody checks.
  fail_on_warning: true

formats:
  - pdf
